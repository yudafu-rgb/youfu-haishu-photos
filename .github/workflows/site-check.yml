# 每周一北京时间 9:00 体检网站：死链、超大图片、漏统计代码、sitemap 漏页、价格和价格页对不上、优惠过期。
# 有问题开 Issue「网站体检有问题」（GitHub 会发邮件），全部正常了自动关掉。
name: site-check
on:
  schedule:
    - cron: '0 1 * * 1'
  push:
    branches: [main]
    paths: ['docs/**', '工具/check_site.py']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs
            工具
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: check
        run: |
          set +e
          python3 工具/check_site.py > result.txt; code=$?
          cat result.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.check.outputs.code }}" != "0" ]; then
            { echo "网站体检（$(TZ=Asia/Shanghai date '+%m-%d %H:%M')）发现下面的问题，改好后会自动关掉："; echo; grep '^ - ' result.txt; } > body.md
            python3 工具/issue.py open "网站体检有问题" body.md
            exit 1
          else
            python3 工具/issue.py close "网站体检有问题" "体检全部正常（$(TZ=Asia/Shanghai date '+%m-%d %H:%M')）。"
          fi
